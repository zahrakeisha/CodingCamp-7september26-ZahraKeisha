<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== TOP BAR ===== -->
  <div class="topbar">
    <span class="topbar-brand">My Life Dashboard</span>
    <div class="topbar-actions">
      <!-- Custom name -->
      <button id="btn-set-name" class="btn btn-ghost btn-sm" title="Set your name">👤 Set Name</button>
      <!-- Theme toggle -->
      <button id="btn-theme" class="btn btn-ghost btn-sm" title="Toggle light/dark mode">🌙 Dark</button>
    </div>
  </div>

  <!-- ===== GREETING SECTION ===== -->
  <header class="greeting-section">
    <div class="greeting-content">
      <p id="current-date" class="date"></p>
      <h1 id="current-time" class="time"></h1>
      <p id="greeting-text" class="greeting"></p>
    </div>
  </header>

  <!-- ===== MAIN DASHBOARD ===== -->
  <main class="dashboard">

    <!-- FOCUS TIMER -->
    <section class="card timer-card">
      <h2 class="card-title">⏱ Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop" class="btn btn-secondary">Stop</button>
        <button id="timer-reset" class="btn btn-ghost">Reset</button>
      </div>
      <p id="timer-status" class="timer-status">Ready to focus</p>
      <!-- Custom duration -->
      <div class="timer-duration-row">
        <label for="timer-duration-input" class="timer-duration-label">Duration (min)</label>
        <input
          type="number"
          id="timer-duration-input"
          class="timer-duration-input"
          min="1"
          max="120"
          value="25"
        />
        <button id="timer-duration-set" class="btn btn-ghost btn-sm">Set</button>
      </div>
    </section>

    <!-- TO-DO LIST -->
    <section class="card todo-card">
      <h2 class="card-title">✅ To-Do List</h2>
      <div class="todo-input-row">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="Add a new task..."
          maxlength="100"
        />
        <button id="todo-add" class="btn btn-primary">Add</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-empty" class="empty-hint">No tasks yet. Add one above!</p>
    </section>

    <!-- QUICK LINKS -->
    <section class="card links-card">
      <h2 class="card-title">🔗 Quick Links</h2>
      <div class="links-input-row">
        <input
          type="text"
          id="link-name-input"
          class="link-input"
          placeholder="Label (e.g. GitHub)"
          maxlength="30"
        />
        <input
          type="url"
          id="link-url-input"
          class="link-input"
          placeholder="URL (e.g. https://github.com)"
        />
        <button id="link-add" class="btn btn-primary">Add</button>
      </div>
      <div id="links-list" class="links-list"></div>
      <p id="links-empty" class="empty-hint">No links yet. Add your favourites!</p>
    </section>

  </main>

  <!-- EDIT MODAL (shared for todo & link) -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modal-title" class="modal-title">Edit</h3>
      <input type="text" id="modal-input-primary" class="modal-input" placeholder="" />
      <input type="url" id="modal-input-secondary" class="modal-input hidden" placeholder="URL" />
      <div class="modal-actions">
        <button id="modal-save" class="btn btn-primary">Save</button>
        <button id="modal-cancel" class="btn btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
